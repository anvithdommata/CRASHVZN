# Pipeline input for incident-demo. The app does not need this file.
# Label overrides win over a measured label when both exist. Tracks are read
# from the class-colored boxes burned into demo.mp4.

incident_id: incident-demo
schema_version: "1.0.0"
description: "Autobahn scene measured from the class boxes in demo.mp4. Includes the multi-vehicle incident on carriageway B. Along-road scale uses the configured focal length."

mosaic: demo.mp4
output: BackEnd/scene-packages/incident-demo

fps: 12.5
duration_s: 59.92
frame_count: 749
width: 960
height: 610
has_audio: false

lane_width_m: 3.5
lanes_per_carriageway: 3
shoulder: true
median_half_width_m: 1.75
stretch_m: 160
x_min_m: -80
x_max_m: 80

impact_separation_m: 2.5
impact_min_closing_mps: 0.3

sigma:
  pos_m: 0.5
  speed_mps: 0.75

seeds:
  schematic: 7
  kinematics: 7

models:
  - {role: detector, name: burned-in-class-boxes, version: legend-colors, seed: 11}
  - {role: tracker, name: iou, version: "1", seed: 11}
  - {role: ground, name: lane-width-fan, version: "1", seed: 11}
  - {role: kinematics, name: kalman-rts, version: "1", seed: 7}

# Inclusive pixel spans. Image y grows downward. These gutters are not part of a view.
gutters:
  column_x: [479, 480]
  row_y: [300, 303]
  letterbox_y: [604, 609]

# Must match the rectangles implied by the gutters.
crops:
  cam_tl: {x: 0, y: 0, width: 479, height: 300}
  cam_tr: {x: 481, y: 0, width: 479, height: 300}
  cam_bl: {x: 0, y: 304, width: 479, height: 300}
  cam_br: {x: 481, y: 304, width: 479, height: 300}

intrinsics:
  model: pinhole
  fx: 430
  fy: 430
  cx: 239.5
  cy: 150

# Carriageway A is the left column and heads −X. Carriageway B is the right
# column, the exit side, and heads +X.
road_carriageways:
  a:
    heading: "-X"
    z_sign: 1
    cameras: [cam_tl, cam_bl]
  b:
    heading: "+X"
    z_sign: -1
    cameras: [cam_tr, cam_br]

cameras:
  cam_tl:
    carriageway: a
    eye: [40, 16, 24]
    target: [-30, 1, 7]
    note: "Configured stand-in pose along carriageway A. Tracks are measured from the video, not from this pose."
  cam_tr:
    carriageway: b
    eye: [-40, 16, -24]
    target: [30, 1, -7]
    note: "Configured stand-in pose along carriageway B. Tracks are measured from the video, not from this pose."
  cam_bl:
    carriageway: a
    eye: [-10, 8, 22]
    target: [-70, 1, 6]
    note: "Configured stand-in pose along carriageway A. Tracks are measured from the video, not from this pose."
  cam_br:
    carriageway: b
    eye: [15, 7, -20]
    target: [60, 1, -10]
    note: "Configured stand-in pose along carriageway B. Tracks are measured from the video, not from this pose."

default_dims_m:
  car: {length: 4.6, width: 1.85, height: 1.5}
  van: {length: 5.3, width: 2.0, height: 2.2}
  truck: {length: 7.6, width: 2.5, height: 3.4}

# Optional corrections keyed by the measured entity id. Empty unless a label is wrong.
label_overrides: {}
